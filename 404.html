<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Page Not Found - Adam Thompson</title>

        <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=DM+Sans:wght@300;500&display=swap" rel="stylesheet" />

        <script>
            (function () {
                var stored = null;
                try {
                    stored = localStorage.getItem('theme');
                } catch (e) {}
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = stored || (prefersDark ? 'dark' : 'light');
            })();
        </script>

        <link rel="stylesheet" href="/main.css" />

        <meta name="robots" content="noindex" />
    </head>
    <body>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <circle cx="12" cy="12" r="4.5" />
                <path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" />
            </svg>
        </button>

        <div class="page">
            <header class="site-header">
                <h1>Page not found<span class="tagline"> &mdash; 404.</span></h1>
                <p class="sub">Looks like this trail doesn't go anywhere. The page you're after may have moved, or never existed.</p>
            </header>

            <nav class="nav-links">
                <a href="/">Back home</a>
                <a href="https://adamthompsonphoto.com" target="_blank">Photography</a>
                <a href="https://hackeradam.com" target="_blank">Tech Blog</a>
            </nav>
        </div>

        <script>
            (function () {
                var root = document.documentElement;
                var toggle = document.querySelector('.theme-toggle');
                var media = window.matchMedia('(prefers-color-scheme: dark)');

                function label() {
                    var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
                    toggle.setAttribute('aria-label', 'Switch to ' + next + ' mode');
                }

                toggle.addEventListener('click', function () {
                    var next = root.dataset.theme === 'dark' ? 'light' : 'dark';
                    root.dataset.theme = next;
                    try {
                        localStorage.setItem('theme', next);
                    } catch (e) {}
                    label();
                });

                // Follow system changes until the visitor picks a theme themselves
                media.addEventListener('change', function (e) {
                    var stored = null;
                    try {
                        stored = localStorage.getItem('theme');
                    } catch (err) {}
                    if (!stored) {
                        root.dataset.theme = e.matches ? 'dark' : 'light';
                        label();
                    }
                });

                label();
            })();
        </script>
    </body>
</html>
